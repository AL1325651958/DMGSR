[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmgsr"
version = "0.1.0"
description = "Closed-loop residual diffusion for CMIP6 solar radiation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "torch>=2.0",
  "PyYAML>=6.0",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
